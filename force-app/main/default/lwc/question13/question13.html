<template>
    <lightning-card title="Display Account Records using Data Table">
        <div class="slds-p-around_medium">
            <template lwc:if={accounts}>
                <lightning-datatable
                    key-field="Id"
                    data={accounts}
                    columns={columns}>
                </lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
