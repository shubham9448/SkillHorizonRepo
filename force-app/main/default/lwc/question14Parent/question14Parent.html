<template>
    <lightning-card title="Display Developmental Life Stage">
        <div class="slds-p-around_medium">
            <lightning-input type="number" label="Please Enter Your Age" onchange={handleAgeChange}></lightning-input>
            <div class="slds-p-around_medium">
                <lightning-button label="Submit" variant="brand" onclick={handleClick}></lightning-button>
            </div>
        </div>
        <template lwc:if={show}>
            <div class="slds-p-around_medium ">
                <c-question14-child age={age} class="slds-p-around_medium"></c-question14-child>
            </div>
        </template>
    </lightning-card>
</template>
